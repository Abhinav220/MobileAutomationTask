# Appium Server Configuration
appium.server.url=http://127.0.0.1:4723

# Platform Selection: Android or iOS
platform=Android

# Android Device Configuration
android.device.name=emulator-5554
android.platform.name=Android
android.platform.version=16
android.automation.name=UiAutomator2

# iOS Device Configuration
ios.device.name=iPhone 14
ios.platform.version=16.0
ios.bundle.id=com.saucelabs.SwagLabsMobileApp
ios.udid=
ios.auto.accept.alerts=true
ios.auto.dismiss.alerts=false

# App Configuration - Platform-specific paths
# Android: APK file path
app.path=src/main/resources/app/Android.SauceLabs.Mobile.Sample.app.2.7.1.apk
# iOS: APP or IPA file path (uncomment and set when using iOS)
# ios.app.path=src/main/resources/app/SwagLabs.app

# App package and activity (Android only, used as fallback or for appWaitActivity)
app.package=com.swaglabsmobileapp
app.activity=com.swaglabsmobileapp.SplashActivity

# Test Data
test.username=standard_user
test.password=secret_sauce

# Wait Configuration (in seconds)
implicit.wait=10
explicit.wait=15

# Browser/Web Testing Configuration
browser.name=chromium
browser.headless=false
browser.viewport.size=1920x1080
browser.timeout=30000
web.app.url=https://www.saucedemo.com

# Xray Integration Configuration
xray.enabled=false
# Xray credentials - use either plain text or encrypted (encrypted recommended)
xray.client.id=
xray.client.secret=
# Encrypted Xray credentials (use CredentialEncryptor utility to generate)
# xray.client.id.encrypted=
# xray.client.secret.encrypted=
xray.auth.endpoint=https://xray.cloud.getxray.app/api/oauth/token
xray.execution.endpoint=https://xray.cloud.getxray.app/api/v2/import/execution
xray.attachment.endpoint=https://xray.cloud.getxray.app/api/v2/issue/{}/attachments
xray.exec.id=

# Jira Configuration (for report attachments)
jira.url=
# Jira credentials - use either plain text or encrypted (encrypted recommended)
jira.email=
jira.token=
# Encrypted Jira credentials (use CredentialEncryptor utility to generate)
# jira.email.encrypted=
# jira.token.encrypted=

# Encryption Configuration
# Secret key for encrypting/decrypting credentials (change this to your own key)
encryption.secret.key=SauceLabAutomation
